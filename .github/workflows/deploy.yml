name: Deploy to Vercel

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Vercel env vars are set
        run: |
          TOKEN="${{ secrets.VERCEL_TOKEN }}"
          PROJECT="${{ secrets.VERCEL_PROJECT_ID }}"
          TEAM="${{ secrets.VERCEL_ORG_ID }}"
          # Upsert VITE_SUPABASE_URL
          curl -s -X POST "https://api.vercel.com/v10/projects/$PROJECT/env?teamId=$TEAM&upsert=true" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"key\":\"VITE_SUPABASE_URL\",\"value\":\"${{ secrets.VITE_SUPABASE_URL }}\",\"type\":\"plain\",\"target\":[\"production\",\"preview\",\"development\"]}" > /dev/null
          # Upsert VITE_SUPABASE_ANON_KEY
          curl -s -X POST "https://api.vercel.com/v10/projects/$PROJECT/env?teamId=$TEAM&upsert=true" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"key\":\"VITE_SUPABASE_ANON_KEY\",\"value\":\"${{ secrets.VITE_SUPABASE_ANON_KEY }}\",\"type\":\"plain\",\"target\":[\"production\",\"preview\",\"development\"]}" > /dev/null
          echo "Env vars ensured ✓"

      - name: Trigger Vercel Production Deployment
        run: |
          RESPONSE=$(curl -s -X POST \
            "https://api.vercel.com/v13/deployments?teamId=${{ secrets.VERCEL_ORG_ID }}" \
            -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"cative-tasks\",
              \"project\": \"${{ secrets.VERCEL_PROJECT_ID }}\",
              \"target\": \"production\",
              \"gitSource\": {
                \"type\": \"github\",
                \"org\": \"lincolnvalero\",
                \"repo\": \"cative-tasks\",
                \"ref\": \"${{ github.ref_name }}\"
              }
            }")

          DPL_ID=$(echo "$RESPONSE" | grep -o '"id":"dpl_[^"]*"' | head -1 | cut -d'"' -f4)
          DPL_URL=$(echo "$RESPONSE" | grep -o '"url":"[^"]*"' | head -1 | cut -d'"' -f4)
          STATE=$(echo "$RESPONSE" | grep -o '"readyState":"[^"]*"' | head -1 | cut -d'"' -f4)

          echo "Deployment ID: $DPL_ID"
          echo "Deployment URL: $DPL_URL"
          echo "Initial state: $STATE"

          if [ -z "$DPL_ID" ]; then
            echo "ERROR: Failed to create deployment"
            echo "$RESPONSE" | head -200
            exit 1
          fi

          # Poll until READY or ERROR (max 8 minutes)
          for i in $(seq 1 48); do
            sleep 10
            POLL=$(curl -s \
              "https://api.vercel.com/v13/deployments/$DPL_ID?teamId=${{ secrets.VERCEL_ORG_ID }}" \
              -H "Authorization: Bearer ${{ secrets.VERCEL_TOKEN }}")
            CURRENT_STATE=$(echo "$POLL" | grep -o '"readyState":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "[$i/48] State: $CURRENT_STATE"
            if [ "$CURRENT_STATE" = "READY" ]; then
              echo "✅ Deployed successfully!"
              echo "Production: https://cative-tasks.vercel.app"
              exit 0
            fi
            if [ "$CURRENT_STATE" = "ERROR" ] || [ "$CURRENT_STATE" = "CANCELED" ]; then
              echo "❌ Deployment failed with state: $CURRENT_STATE"
              exit 1
            fi
          done

          echo "⚠️ Deployment triggered but timed out waiting. Check: https://vercel.com/lincolnvaleros-projects/cative-tasks"
          exit 0
